<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Cotizaciones — Cotizador de Servicios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/gestion.js" defer></script>
</head>

<body>
    <header>
        <div class="box-titulos">
            <h1 class="fs-3">Cotizador de Servicios</h1>
            <p>Nombre Empresa</p>
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Cotizador</a></li>
                <li><a href="./admin.html">Configuración</a></li>
            </ul>
            <div class="selector-moneda" role="group" aria-label="Selector de moneda">
                <button type="button">ARS</button>
                <button type="button">USD</button>
            </div>
        </nav>
    </header>

    <main>
        <h2>Historial de cotizaciones</h2>
        <fieldset class="box-filtros">
            <div class="box-filtro-busqueda">
                <label for="filtro-busqueda">Buscar</label>
                <div class="contenedor-busqueda">
                    <svg class="icono-lupa" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="filtro-busqueda" placeholder="Cliente o número (COT-0001)...">
                </div>
            </div>

            <div class="box-filtros-selects">
                <div>
                    <label for="filtro-estado">Filtrar por estado</label>
                    <select name="filtro-estado" id="filtro-estado">
                        <option value="todos" selected>Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="vencida">Vencida</option>
                        <option value="completada">Completada</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-categoria">Filtrar por categoría</label>
                    <select name="filtro-categoria" id="filtro-categoria">
                        <option value="todos" selected>Todas</option>

                    </select>
                </div>
            </div>
        </fieldset>

        <section id="box-historial-cotizacion">
            <!-- aqui van las cotizaciones realizadas EJEMPLO (todo dinamico) -->
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
