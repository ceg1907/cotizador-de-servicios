<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Cotizaciones — Cotizador de Servicios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">

    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs@1.1.9/dist/auto/ring.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/gestion.js" defer></script>
</head>

<body>
    <div id="box-cargando" class="box-cargando d-none">
        <l-ring size="40" color="#1F4B43"></l-ring>
    </div>
    <header>
        <div class="header-contenido">
            <div class="box-titulos">
                <h1>
                    <a href="../index.html">
                        <span class="logo-marca" aria-hidden="true">c</span>
                        <span>Cotizador <span class="titulo-app-detalle">de Servicios</span></span>
                    </a>
                </h1>
            </div>

            <div class="box-navegacion">
                <p class="empresa-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                        <path d="M10 6h4M10 10h4M10 14h4M10 18h4"></path>
                    </svg>
                    <span id="nombre-empresa-header">Nombre Empresa</span>
                </p>

                <nav aria-label="Navegación principal">
                    <ul>
                        <li><a href="../index.html">Cotizador</a></li>
                        <li><a href="./historial.html" aria-current="page">Historial</a></li>
                        <li><a href="./admin.html">Configuración</a></li>
                    </ul>
                </nav>

                <div class="selector-moneda" role="group" aria-label="Selector de moneda">
                    <button id="btn-moneda-ars" type="button">ARS</button>
                    <button id="btn-moneda-usd" type="button">USD</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="encabezado-pagina">
            <div>
                <p class="antetitulo">Tus propuestas</p>
                <h2>Historial de cotizaciones</h2>
                <p class="subtitulo">Revisá, descargá o gestioná todas tus cotizaciones.</p>
            </div>
        </div>
        <fieldset class="box-filtros">
            <div class="box-filtro-busqueda">
                <label for="filtro-busqueda">Buscar</label>
                <div class="contenedor-busqueda">
                    <svg class="icono-lupa" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="filtro-busqueda" placeholder="Cliente o número (COT-0001)...">
                </div>
            </div>

            <div class="box-filtros-selects">
                <div>
                    <label for="filtro-estado">Filtrar por estado</label>
                    <select name="filtro-estado" id="filtro-estado">
                        <option value="todos" selected>Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="vencida">Vencida</option>
                        <option value="completada">Completada</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-categoria">Filtrar por categoría</label>
                    <select name="filtro-categoria" id="filtro-categoria">
                        <option value="todos" selected>Todas</option>

                    </select>
                </div>
            </div>
        </fieldset>

        <section id="box-historial-cotizacion">

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
