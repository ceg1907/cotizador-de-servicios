<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Servicios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="./js/app.js" defer></script>
    <script src="./js/cotizador.js" defer></script>
</head>

<body>
    <header>
        <div class="box-titulos">
            <h1 class="fs-3">Cotizador de Servicios</h1>
            <p>Nombre Empresa</p>
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="./pages/historial.html">Historial</a></li>
                <li><a href="./pages/admin.html">Configuración</a></li>
            </ul>
            <div class="selector-moneda" role="group" aria-label="Selector de moneda">
                <button type="button">ARS</button>
                <button type="button">USD</button>
            </div>
        </nav>
    </header>

    <main class="main-index">
        <section class="box-servicios" aria-label="Cotización en curso">

            <div class="box-cliente" id="box-cliente">
                <div class="box-cliente-header">
                    <h2>Datos del cliente</h2>
                    <button type="button" class="btn-link" id="btn-seleccionar-cliente" data-bs-toggle="modal"
                        data-bs-target="#modalSeleccionarCliente">Seleccionar cliente</button>
                </div>
                <div id="box-cliente-dinamico">
                    <!-- EJEMPLO (todo dinamico) -->
                </div>
            </div>

            <div class="box-header-servicios">
                <div>
                    <h3 class="fs-4">Servicios en esta cotización</h3>
                    <p class="texto-ayuda m-0">Agregá, editá la cantidad o quitá servicios de la lista.</p>
                </div>
                <button type="button" class="btn-primario" data-bs-toggle="modal"
                    data-bs-target="#modalAgregarServicio">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Agregar servicio
                </button>
            </div>

            <div id="box-lista-cotizacion" class="box-lista-servicios-cotizacion">
                <!-- EJEMPLO (todo dinamico) -->
            </div>
        </section>

        <aside class="box-resumen" aria-label="Resumen de la cotización">
            <h2>Resumen</h2>

            <ul class="box-items-cotizacion" id="box-items-cotizacion">
                <!-- EJEMPLO (todo dinamico) -->
            </ul>

            <div class="box-confirm">
                <div class="box-subtotales">
                    <div><span>Subtotal</span><span id="num-subtotal">$0</span></div>
                    <div><span>Descuento</span><span id="num-descuento">$0</span></div>
                    <div><span>Impuesto</span><span id="num-impuesto">$0</span></div>
                </div>
                <div class="box-total">
                    <h4>Total</h4>
                    <span id="num-total" class="monto">$0</span>
                </div>
                <div class="box-vigencia">
                    <label for="fecha-vigencia">Válida hasta</label>
                    <input type="date" id="fecha-vigencia" name="fecha-vigencia">
                </div>
                <div class="botones-confirm">
                    <button type="button" class="btn-primario" id="btn-confirmar">Confirmar cotización</button>
                    <button type="button" class="btn-secundario" id="btn-vaciar">Vaciar cotización</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal: Agregar servicio -->
    <div class="modal fade" id="modalAgregarServicio" tabindex="-1" aria-labelledby="modalAgregarServicioLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalAgregarServicioLabel">Seleccionar servicio</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="box-buscador-accion">
                        <div class="contenedor-busqueda">
                            <svg class="icono-lupa" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <label for="buscar-servicio-modal" class="visually-hidden">Buscar servicio</label>
                            <input type="text" id="buscar-servicio-modal" placeholder="Buscar por nombre...">
                        </div>
                        <div>
                            <label for="filtro-categoria-modal" class="visually-hidden">Filtrar por categoría</label>
                            <select id="filtro-categoria-modal">
                                <option value="todas" selected>Todas las categorías</option>
                            </select>
                        </div>
                    </div>

                    <div id="box-resultados-servicios" class="box-resultados">
                        <!-- EJEMPLO (todo dinamico) -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secundario" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Seleccionar cliente -->
    <div class="modal fade" id="modalSeleccionarCliente" tabindex="-1" aria-labelledby="modalSeleccionarClienteLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalSeleccionarClienteLabel">Seleccionar cliente</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="contenedor-busqueda">
                        <svg class="icono-lupa" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <label for="buscar-cliente-modal" class="visually-hidden">Buscar cliente</label>
                        <input type="text" id="buscar-cliente-modal" placeholder="Buscar por nombre o email...">
                    </div>

                    <div id="box-resultados-clientes" class="box-resultados">
                        <!-- EJEMPLO (todo dinamico) -->
                    </div>
                </div>
                <div class="modal-footer modal-footer-split">
                    <a href="./pages/admin.html" class="btn-link">+ Nuevo cliente</a>
                    <button type="button" class="btn-secundario" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
